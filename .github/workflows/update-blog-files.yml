name: Update Blog Files and Convert to HTML

on:
  push:
    paths:
      - 'blog_original/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-json-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install markdown-it
        run: npm install -g markdown-it
      
      - name: Convert Markdown to HTML
        run: |
          # 创建blog目录（如果不存在）
          mkdir -p blog
          
          # 清空现有的blog目录
          rm -rf blog/*
          
          # 遍历blog_original目录中的所有Markdown文件并转换为HTML
          cd blog_original
          md_files=($(find . -name "*.md" -type f -not -path "*/\.*" | sort))
          
          for md_file in "${md_files[@]}"; do
            # 获取相对路径
            rel_path=${md_file#./}
            # 创建目标目录
            target_dir="../blog/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            # 转换文件名（.md 替换为 .html）
            html_file="${rel_path%.md}.html"
            echo "Converting $rel_path to $html_file"
            
            # 添加基本HTML头部和样式
            echo "<!DOCTYPE html>" > "../blog/$html_file"
            echo "<html lang=\"en\">" >> "../blog/$html_file"
            echo "<head>" >> "../blog/$html_file"
            echo "  <meta charset=\"UTF-8\">" >> "../blog/$html_file"
            echo "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">" >> "../blog/$html_file"
            echo "  <title>${rel_path%.md}</title>" >> "../blog/$html_file"
            echo "  <link rel=\"stylesheet\" href=\"/style.css\">" >> "../blog/$html_file"
            echo "  <script type=\"importmap\">" >> "../blog/$html_file"
            echo "    {" >> "../blog/$html_file"
            echo "      \"imports\": {" >> "../blog/$html_file"
            echo "        \"@material/web/\": \"https://esm.run/@material/web/\"" >> "../blog/$html_file"
            echo "      } " >> "../blog/$html_file"
            echo "    }" >> "../blog/$html_file"
            echo "  </script>" >> "../blog/$html_file"
            echo "  <script type=\"module\">" >> "../blog/$html_file"
            echo "    import '@material/web/all.js';" >> "../blog/$html_file"
            echo "    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';" >> "../blog/$html_file"
            echo "    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);" >> "../blog/$html_file"
            echo "  </script>" >> "../blog/$html_file"
            echo "</head>" >> "../blog/$html_file"
            echo "<body>" >> "../blog/$html_file"
            
            # 使用markdown-it转换Markdown到HTML
            markdown-it "$md_file" >> "../blog/$html_file"
            
            # 添加Material Design 3 返回按钮
            echo "<br>" >> "../blog/$html_file"
            echo "<div style=\"margin: 20px;\">" >> "../blog/$html_file"
            echo "  <md-filled-tonal-button onclick=\"window.location.href='/'\">" >> "../blog/$html_file"
            echo "    <md-icon slot=\"icon\">arrow_back</md-icon>" >> "../blog/$html_file"
            echo "    返回首页" >> "../blog/$html_file"
            echo "  </md-filled-tonal-button>" >> "../blog/$html_file"
            echo "</div>" >> "../blog/$html_file"
            
            echo "</body>" >> "../blog/$html_file"
            echo "</html>" >> "../blog/$html_file"
          done
          cd ..
      
      - name: Generate blog-files.json from HTML files
        run: |
          cd blog
          files=($(find . -name "*.html" -type f -not -path "*/\.*" | sort))
          total_files=${#files[@]}
          
          echo "[" > ../blog-files.json
          
          for (( i=0; i<$total_files; i++ )); do
            file=${files[$i]#./}
            if [ -n "$file" ]; then
              if [ $i -eq $((total_files-1)) ]; then
                echo "  \"$file\"" >> ../blog-files.json
              else
                echo "  \"$file\"," >> ../blog-files.json
              fi
            fi
          done
          
          echo "]" >> ../blog-files.json
          cd ..
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog-files.json blog/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update blog-files.json and generate HTML files" && git push)