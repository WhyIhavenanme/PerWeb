name: Update Blog Files and Convert to HTML

on:
  push:
    paths:
      - 'blog/**'  # 当 blog 目录有变化时触发
  workflow_dispatch:  # 允许手动触发
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 00:00 运行一次

jobs:
  update-json-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install pandoc
        run: sudo apt-get install -y pandoc
      
      - name: Convert Markdown to HTML
        run: |
          # 创建blog-html目录（如果不存在）
          mkdir -p blog-html
          
          # 清空现有的blog-html目录
          rm -rf blog-html/*
          
          # 遍历blog目录中的所有Markdown文件并转换为HTML
          cd blog
          md_files=($(find . -name "*.md" -type f -not -path "*/\.*" | sort))
          
          for md_file in "${md_files[@]}"; do
            # 获取相对路径
            rel_path=${md_file#./}
            # 创建目标目录
            target_dir="../blog-html/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            # 转换文件名（.md 替换为 .html）
            html_file="${rel_path%.md}.html"
            echo "Converting $rel_path to $html_file"
            
            # 添加基本HTML头部和样式
            echo "<!DOCTYPE html>" > "../blog-html/$html_file"
            echo "<html lang=\"en\">" >> "../blog-html/$html_file"
            echo "<head>" >> "../blog-html/$html_file"
            echo "  <meta charset=\"UTF-8\">" >> "../blog-html/$html_file"
            echo "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">" >> "../blog-html/$html_file"
            echo "  <title>${rel_path%.md}</title>" >> "../blog-html/$html_file"
            echo "  <link rel=\"stylesheet\" href=\"/style.css\">" >> "../blog-html/$html_file"
            echo "</head>" >> "../blog-html/$html_file"
            echo "<body class=\"markdown-body\">" >> "../blog-html/$html_file"
            
            # 使用pandoc转换Markdown到HTML
            pandoc "$md_file" -o temp.html
            cat temp.html >> "../blog-html/$html_file"
            rm temp.html
            
            echo "</body>" >> "../blog-html/$html_file"
            echo "</html>" >> "../blog-html/$html_file"
          done
          cd ..
      
      - name: Generate blog-files.json from HTML files
        run: |
          # 列出 blog-html 目录中的所有HTML文件并创建 JSON 数组
          cd blog-html
          
          # 获取所有HTML文件并保存到数组中
          files=($(find . -name "*.html" -type f -not -path "*/\.*" | sort))
          total_files=${#files[@]}
          
          echo "[" > ../blog-files.json
          
          for (( i=0; i<$total_files; i++ )); do
            file=${files[$i]#./}  # 删除开头的 ./
            if [ -n "$file" ]; then
              # 如果是最后一个文件，不添加逗号
              if [ $i -eq $((total_files-1)) ]; then
                echo "  \"$file\"" >> ../blog-files.json
              else
                echo "  \"$file\"," >> ../blog-files.json
              fi
            fi
          done
          
          echo "]" >> ../blog-files.json
          cd ..
          cat blog-files.json  # 显示生成的文件内容
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog-files.json blog-html/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update blog-files.json and generate HTML files" && git push)