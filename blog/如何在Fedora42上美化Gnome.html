  <title>如何在Fedora42上美化Gnome</title>

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"

  <script type="module">
    import '@material/web/all.js';

  </script>

美吧？😋</h2>
<h2>Gnome美化离不开扩展</h2>
<ol>
<li>
<h3><a href="https://extensions.gnome.org/extension/3193/blur-my-shell/">Blur my Shell</a>:</h3>
为你能看到的大部分东西增加模糊效果，接近MacOS的效果<br>
建议顶栏、概览的管线设置为「本地高斯模糊：半径60,亮度1.00」<br>
应用程序方面：「应用程序模糊：强度95,亮度1.00,不透明度220,启用概述上的模糊」。建议使用模糊效果的应用有：org.gnome.Nautilus、QQ、Code、以及终端</li>
<li>
<h3><a href="https://extensions.gnome.org/extension/307/dash-to-dock/">Dash to Dock</a></h3>
顾名思义，添加Dock栏</li>
</ol>
<br>
